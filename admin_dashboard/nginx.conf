server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # /api/** va al backend sulla rete Docker interna: stessa origin per il browser,
    # niente CORS da configurare in produzione (mimando il proxy di Vite in dev).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Service worker e manifest: mai in cache lato reverse proxy, sono loro stessi
    # a gestire l'aggiornamento (vite-plugin-pwa, autoUpdate).
    location ~* \.(?:js|css|png|svg|ico|webmanifest)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # SPA: qualunque altra rotta serve index.html, il routing lo fa react-router lato client.
    location / {
        try_files $uri /index.html;
    }
}
