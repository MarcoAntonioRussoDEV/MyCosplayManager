name: cosplayinventory
services:
    postgres:
        image: postgres:16-alpine
        environment:
            POSTGRES_DB: cosplayinventory
            POSTGRES_USER: cosplayinventory
            POSTGRES_PASSWORD: cosplayinventory
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U cosplayinventory"]
            interval: 5s
            timeout: 5s
            retries: 10

    backend:
        build: ./backend
        depends_on:
            postgres:
                condition: service_healthy
        environment:
            DB_URL: jdbc:postgresql://postgres:5432/cosplayinventory
            DB_USERNAME: cosplayinventory
            DB_PASSWORD: cosplayinventory
            UPLOAD_DIR: /data/uploads
            GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS}
            JWT_SECRET: ${JWT_SECRET:-ia3foHgQp0t8OOEJoB7SWTN9tafVUyyyjyif6OLhqLM=}
            FIREBASE_CREDENTIALS_PATH: /data/secrets/firebase-service-account.json
            ADMIN_ALLOWED_EMAILS: ${ADMIN_ALLOWED_EMAILS:-}
        ports:
            - "8080:8080"
        volumes:
            - uploads_data:/data/uploads
            - ./secrets:/data/secrets:ro

volumes:
    postgres_data:
    uploads_data:
