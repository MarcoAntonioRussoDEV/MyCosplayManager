name: MyCosplayManager
services:
    postgres:
        container_name: postgres-db
        image: postgres:16-alpine
        environment:
            POSTGRES_DB: mycosplaymanager
            POSTGRES_USER: mycosplaymanager
            POSTGRES_PASSWORD: mycosplaymanager
        # Niente porta pubblicata verso l'host: solo backend/altri container sulla rete
        # docker interna ci parlano (via hostname "postgres"), nessun motivo per esporlo
        # fuori, tanto meno su un deploy raggiungibile da internet.
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U mycosplaymanager"]
            interval: 5s
            timeout: 5s
            retries: 10

    backend:
        container_name: backend
        build: ./backend
        depends_on:
            postgres:
                condition: service_healthy
        environment:
            DB_URL: jdbc:postgresql://postgres:5432/mycosplaymanager
            DB_USERNAME: mycosplaymanager
            DB_PASSWORD: mycosplaymanager
            UPLOAD_DIR: /data/uploads
            GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS}
            JWT_SECRET: ${JWT_SECRET:-ia3foHgQp0t8OOEJoB7SWTN9tafVUyyyjyif6OLhqLM=}
            FIREBASE_CREDENTIALS_PATH: /data/secrets/firebase-service-account.json
            ADMIN_ALLOWED_EMAILS: ${ADMIN_ALLOWED_EMAILS:-}
        ports:
            - "8080:8080"
        volumes:
            - uploads_data:/data/uploads
            - ./secrets:/data/secrets:ro

    admin:
        container_name: admin-dashboard
        build: ./admin_dashboard
        depends_on:
            - backend
        ports:
            - "8081:80"

    # Termina TLS per backend/admin riusando il certificato Let's Encrypt gia' emesso
    # per questo stesso dominio da OperazioneFratellino (stesso host, stessa DDNS) —
    # niente richiesta di un nuovo certificato, niente conflitto sulle porte 80/443
    # (gia' occupate da OF, servono solo per la sfida ACME/il rinnovo del certbot di OF).
    caddy:
        image: caddy:2-alpine
        container_name: mcm-caddy
        depends_on:
            - backend
            - admin
        ports:
            - "9443:9443"
            - "9444:9444"
        volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile:ro
            - /etc/letsencrypt:/etc/letsencrypt:ro

volumes:
    postgres_data:
    uploads_data:
