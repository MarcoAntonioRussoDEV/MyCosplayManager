spring:
    application:
        name: cosplayinventory-backend
    autoconfigure:
        exclude:
            # JWT gestito interamente da JwtAuthenticationFilter: nessun
            # UserDetailsService/AuthenticationManager standard serve.
            - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
    datasource:
        url: ${DB_URL:jdbc:postgresql://localhost:5432/cosplayinventory}
        username: ${DB_USERNAME:cosplayinventory}
        password: ${DB_PASSWORD:cosplayinventory}
    jpa:
        hibernate:
            ddl-auto: validate
        open-in-view: false
        properties:
            hibernate:
                format_sql: true
    flyway:
        enabled: true
        locations: classpath:db/migration
    servlet:
        multipart:
            max-file-size: 15MB
            max-request-size: 15MB

server:
    port: ${SERVER_PORT:8080}
    # Dietro reverse proxy: senza questo Spring ignora gli header
    # X-Forwarded-Proto/Host e costruisce URL assoluti con scheme sbagliato.
    forward-headers-strategy: framework
    error:
        # Default Spring nasconde il campo "message" nel body di errore JSON: senza
        # questo il motivo di un ResponseStatusException non arriva mai al client.
        include-message: always

cosplayinventory:
    storage:
        upload-dir: ${UPLOAD_DIR:./uploads}
    notification:
        expiry-warning-days-default: 3
        # Ogni 5 minuti: lo scheduler invia a ciascun utente solo se non gia' notificato oggi.
        scan-cron: "0 */5 * * * *"
        firebase-credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
    jwt:
        # Dev-only default: sovrascrivere con JWT_SECRET in produzione (>= 32 byte, base64).
        secret: ${JWT_SECRET:ia3foHgQp0t8OOEJoB7SWTN9tafVUyyyjyif6OLhqLM=}
        expiration-minutes: ${JWT_EXPIRATION_MINUTES:10080}
        # Sessione piu' corta per la dashboard admin (browser condiviso/postazione fissa).
        admin-expiration-minutes: ${JWT_ADMIN_EXPIRATION_MINUTES:480}
    google:
        # Web/Android Client ID di Google Cloud Console usato per verificare l'ID token
        # inviato dall'app Flutter dopo il login con google_sign_in.
        client-ids: ${GOOGLE_CLIENT_IDS:}
    admin:
        # Uniche email autorizzate ad accedere alla dashboard admin via Google OAuth
        # (separate da virgola). Nessuna tabella: ricontrollata ad ogni richiesta, non
        # solo al login, cosi' rimuovere un'email qui invalida subito anche i suoi token.
        allowed-emails: ${ADMIN_ALLOWED_EMAILS:}
